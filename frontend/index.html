<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#ED1C24" />
    <link rel="manifest" href="/manifest.json" />
    <title>Booshnam Associates</title>
    <script>
      (function() {
        function enterFS() {
          var d = document.documentElement;
          var req = d.requestFullscreen || d.webkitRequestFullscreen || d.mozRequestFullScreen || d.msRequestFullscreen;
          if (req && !document.fullscreenElement && !document.webkitFullscreenElement) {
            req.call(d).catch(function() {});
          }
        }
        document.addEventListener('DOMContentLoaded', enterFS);
        window.addEventListener('click', enterFS, { once: true });
        window.addEventListener('touchstart', enterFS, { once: true });
        window.addEventListener('keydown', enterFS, { once: true });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
